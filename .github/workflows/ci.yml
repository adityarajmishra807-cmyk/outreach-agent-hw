name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run domain and policy tests
        run: npm test
      - name: Type-check workspaces
        run: npm run typecheck
      - name: Build extension and dashboard
        run: npm run build
      - name: Verify built extension manifest and resources
        run: npm run verify:extension
      - name: Upload unpacked Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: horizon-agent-chrome-extension
          path: extension/dist/
          if-no-files-found: error
          retention-days: 7

  verify-vercel-web-root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24 (Vercel runtime major)
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Create an isolated copy of the Vercel root directory
        run: mkdir -p /tmp/horizon-web-root && cp -R web/. /tmp/horizon-web-root/
      - name: Install only the web app dependencies
        run: npm install --no-audit --no-fund
        working-directory: /tmp/horizon-web-root
      - name: Type-check standalone Next.js app
        run: npm run typecheck
        working-directory: /tmp/horizon-web-root
      - name: Build standalone Next.js app
        run: npm run build
        working-directory: /tmp/horizon-web-root
