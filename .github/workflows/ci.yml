name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run domain and policy tests
        run: npm test
      - name: Type-check workspaces
        run: npm run typecheck
      - name: Build extension and dashboard
        run: npm run build
      - name: Upload unpacked Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: horizon-agent-chrome-extension
          path: extension/dist/
          if-no-files-found: error
          retention-days: 7
