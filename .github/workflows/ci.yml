name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run domain and policy tests
        run: npm test
      - name: Type-check workspaces
        run: npm run typecheck
      - name: Build extension and dashboard
        run: npm run build
      - name: Verify built extension manifest and resources
        run: npm run verify:extension
      - name: Upload unpacked Chrome extension
        uses: actions/upload-artifact@v4
        with:
          name: horizon-agent-chrome-extension
          path: extension/dist/
          if-no-files-found: error
          retention-days: 7

  verify-vercel-web-root:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 24 (Vercel runtime major)
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install monorepo workspaces
        run: npm install
      - name: Type-check Next.js app from its own directory
        run: npm run typecheck
        working-directory: web
      - name: Build Next.js app from its own directory
        run: npm run build
        working-directory: web
